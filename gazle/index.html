<style>
/* Layout: one centered play column, like a daily-puzzle card. Header, then a single "stage" that swaps between start / question / results. */
:root {
  --bg: #e9ece4;          /* limestone, faint olive bias */
  --surface: #f6f7f2;
  --ink: #18201d;
  --muted: #5d6862;
  --line: #cdd3c8;
  --accent: #2c6650;      /* olive-cedar green */
  --accent-ink: #f4f7f1;
  --gold: #b9862a;        /* timer / speed */
  --good: #2f7d4f;
  --good-bg: #d8ecdd;
  --bad: #a83a32;
  --bad-bg: #f3dcd8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --ink: #e6ebe4; --muted: #95a29a; --line: #2d3832;
    --accent: #6fbf9a; --accent-ink: #0d1411; --gold: #e0b04f;
    --good: #6fcf8f; --good-bg: #1d3626; --bad: #ef8a80; --bad-bg: #3d2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --ink: #e6ebe4; --muted: #95a29a; --line: #2d3832;
  --accent: #6fbf9a; --accent-ink: #0d1411; --gold: #e0b04f;
  --good: #6fcf8f; --good-bg: #1d3626; --bad: #ef8a80; --bad-bg: #3d2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; letter-spacing: -0.03em; line-height: 1; margin: 0; }
.logo span { color: var(--accent); }
.daynum { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: .75rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { color: var(--ink); font-weight: 700; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 440px) { .stage { padding: 18px; } }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

.btn { font: 600 1rem var(--font-body); border-radius: 10px; padding: 13px 18px; cursor: pointer; border: 1px solid transparent; transition: transform .08s, background .15s; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 160px; }

/* rules list */
.rules { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; padding: 0; }
.rules dt { font-family: var(--font-mono); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.rules dd { margin: 0; }

/* progress pips */
.progress { display: flex; gap: 6px; }
.pip { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.pip.cur { background: var(--ink); }
.pip.g { background: var(--good); }
.pip.y { background: var(--gold); }
.pip.r { background: var(--bad); }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.era { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.livepts { font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; color: var(--gold); }
.timer { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.timer > i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; font: 500 1rem var(--font-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; min-width: 0; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-size: .8rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; flex: none; margin-top: 2px; }
.opt:disabled { cursor: default; }
.opt.correct { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.dim { opacity: .55; }

.feedback { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

/* results */
.big { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: 1rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.breakdown { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.bd { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 10px; padding: 10px 12px; align-items: baseline; border-top: 1px solid var(--line); font-size: .9rem; }
.bd:first-child { border-top: 0; }
.bd .q { min-width: 0; }
.bd .t, .bd .p { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .82rem; }
.bd .t { color: var(--muted); }
.bd .p { font-weight: 700; min-width: 3.2em; text-align: right; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 440px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.countdown { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.toast { font-size: .85rem; color: var(--good); min-height: 1.3em; }
.share-fallback { width: 100%; font-family: var(--font-mono); font-size: .85rem; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: none; }
footer { font-size: .78rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">

    <div class="brand">
      <h1 class="logo">Gaz<span>le</span></h1>

/* ---------- Question bank ----------
   Format: [era, question, correct, wrong, wrong, wrong, fact]                */
const BANK = [
  ["Antiquity","In what year did the Roman army destroy the Second Temple in Jerusalem?","70 CE","4 BCE","135 CE","312 CE","Titus's legions sacked Jerusalem in 70 CE, ending the First Jewish–Roman War. The Western Wall is a remnant of the Temple Mount's retaining walls."],
  ["Antiquity","After the Bar Kokhba revolt (132–136 CE), Rome renamed the province of Judea to what?","Syria Palaestina","Aelia Capitolina","Coele-Syria","Idumea","Emperor Hadrian merged Judea into 'Syria Palaestina'; Aelia Capitolina was the new name he gave the city of Jerusalem itself."],

  ["Medieval","Who retook Jerusalem from the Crusaders in 1187?","Saladin","Baibars","Suleiman the Magnificent","Nur ad-Din","Saladin defeated the Crusader army at Hattin and entered Jerusalem in October 1187, 88 years after the First Crusade captured it in 1099."],
  ["Ottoman era","In what year did the Ottoman Empire conquer the region, beginning four centuries of rule?","1516–17","1099","1291","1798","Selim I defeated the Mamluks in 1516–17. Ottoman rule lasted until British forces took the region in 1917–18."],
  ["Ottoman era","Which Ottoman sultan built the walls that still surround Jerusalem's Old City?","Suleiman the Magnificent","Mehmed II","Selim I","Abdul Hamid II","Suleiman's walls were built in 1535–1542 and are today a UNESCO World Heritage site."],
  ["Zionism","Who wrote 'Der Judenstaat' (The Jewish State) in 1896?","Theodor Herzl","Chaim Weizmann","Ahad Ha'am","Leon Pinsker","Herzl, a Viennese journalist, argued for a Jewish state as the answer to European antisemitism and went on to found the Zionist Organization."],
  ["Zionism","Where was the First Zionist Congress held in 1897?","Basel","Vienna","London","Paris","The Basel Program called for 'a home for the Jewish people in Palestine secured under public law'."],
  ["Zionism","In Hebrew, what is the term for Jewish immigration to the Land of Israel?","Aliyah","Galut","Tikkun","Yishuv","Aliyah means 'ascent'. 'Yishuv' refers to the Jewish community living in the land before 1948; 'Galut' means exile."],
  ["Zionism","Degania, founded in 1910 near the Sea of Galilee, is known as the first what?","Kibbutz","Moshav","Yeshiva","Hebrew university","A kibbutz is a collective community. Degania Alef is often called 'the mother of the kibbutzim'."],
  ["Zionism","Tel Aviv was founded in 1909 on the outskirts of which older port city?","Jaffa","Haifa","Acre","Ashkelon","Tel Aviv began as a Jewish garden suburb on dunes north of Jaffa. The two cities merged in 1950 as Tel Aviv–Yafo."],
  ["World War I","The 1916 Sykes–Picot Agreement secretly divided Ottoman lands between Britain and which country?","France","Russia","Italy","Greece","The secret deal (with Russian assent) split the Levant into British and French spheres. It became public in 1917 when the Bolsheviks published it."],
  ["World War I","The Balfour Declaration of 1917 was a letter addressed to whom?","Lord Walter Rothschild","Chaim Weizmann","Theodor Herzl","Sharif Hussein of Mecca","British Foreign Secretary Arthur Balfour backed 'a national home for the Jewish people' in Palestine, adding that nothing should prejudice the civil and religious rights of existing non-Jewish communities."],

  ["British Mandate","Which power received the League of Nations mandate for Palestine?","Britain","France","Italy","The United States","The Mandate was formally approved in 1922 and lasted until May 1948."],
  ["British Mandate","Who was the Grand Mufti of Jerusalem and a leading Palestinian Arab nationalist during the Mandate?","Hajj Amin al-Husseini","Izz ad-Din al-Qassam","Musa Alami","Abd al-Qadir al-Husseini","Appointed by the British in 1921, al-Husseini headed the Arab Higher Committee and later collaborated with Nazi Germany during WWII."],
  ["British Mandate","Riots in 1929 killed 67 Jews in which city, ending its ancient Jewish community for decades?","Hebron","Safed","Jaffa","Nablus","The 1929 riots began over access to the Western Wall. In Hebron, some Arab families also sheltered Jewish neighbours."],

  ["British Mandate","Britain's 1939 White Paper capped Jewish immigration at how many people over five years?","75,000","10,000","250,000","1 million","The White Paper also promised an independent Palestine within ten years. It came just as Jews were desperately trying to flee Nazi Europe."],
  ["British Mandate","Which Jewish underground group bombed the King David Hotel, the British administrative HQ, in 1946?","Irgun","Haganah","Lehi","Palmach","91 people were killed. The Irgun was led by Menachem Begin, who later became Prime Minister."],

  ["1949–1967","From about 1948 to the early 1970s, roughly how many Jews left or were expelled from Arab and Muslim countries?","About 850,000","About 50,000","About 200,000","About 3 million","Many resettled in Israel, where Mizrahi Jews now make up a large part of the population."],

  ["Oslo","The 1994 Cave of the Patriarchs massacre, in which 29 Palestinian worshippers were killed, happened in which city?","Hebron","Nablus","Jenin","Bethlehem","An Israeli settler, Baruch Goldstein, opened fire during Ramadan prayers. Hamas then began suicide bombings inside Israel."],

  ["2000s","Who was elected President of the Palestinian Authority in January 2005?","Mahmoud Abbas","Ismail Haniyeh","Marwan Barghouti","Salam Fayyad","No presidential election has been held since."],
  ["2000s","Which party won the 2006 Palestinian legislative elections?","Hamas","Fatah","PFLP","Palestinian Islamic Jihad","Hamas won 74 of 132 seats. Fighting with Fatah ended with Hamas seizing Gaza in June 2007."],

  ["Gaza","Weekly 2018–2019 protests along the Gaza boundary fence were known as what?","The Great March of Return","The Day of Rage","The Knife Intifada","The Flotilla Movement","More than 200 Palestinians were killed by Israeli fire over the course of the protests."],
  ["Recent","In which year did the United States move its embassy to Jerusalem?","2018","2009","2016","2021","It opened in May 2018, following the Trump administration's 2017 recognition of Jerusalem as Israel's capital."],
  ["Recent","Which two countries signed the first Abraham Accords with Israel in 2020?","UAE and Bahrain","Saudi Arabia and Oman","Morocco and Sudan","Qatar and Kuwait","Morocco and Sudan followed later in 2020."],
  ["Recent","In what year did the UN General Assembly grant Palestine 'non-member observer state' status?","2012","1988","2004","2020","The vote was 138 to 9. Palestine joined the International Criminal Court in 2015."],
  ["Recent","What name did Hamas give its 7 October 2023 attack on Israel?","Al-Aqsa Flood","Swords of Iron","Dawn of Return","Northern Shield","Israel named its military response 'Swords of Iron'."],
  ["Recent","Roughly how many people were taken hostage into Gaza on 7 October 2023?","About 250","About 25","About 1,200","About 2,500","About 1,200 people were killed in Israel that day, the deadliest day for Jews since the Holocaust."],
  ["Recent","Which country brought a genocide case against Israel at the International Court of Justice in December 2023?","South Africa","Turkey","Ireland","Brazil","The ICJ ordered provisional measures in January 2024. Israel denies the charge, and the case is ongoing."],
  ["Jerusalem","The compound in Jerusalem that Jews call the Temple Mount is called what by Muslims?","Haram al-Sharif","Masjid al-Haram","Qubbat al-Sakhra","Bab al-Amud","It holds the al-Aqsa Mosque and the Dome of the Rock. Masjid al-Haram is the Great Mosque in Mecca."],
  ["Jerusalem","Which body has administered the Islamic holy sites on the Temple Mount / Haram al-Sharif?","The Jordanian-run Waqf","The Palestinian Authority","Israel's Chief Rabbinate","The Saudi Ministry of Hajj","Under the 'status quo', Jews may visit but not pray there. Jordan's custodianship is recognized in its 1994 treaty with Israel."],
  ["Politics","How many seats are in Israel's Knesset?","120","100","150","72","The number 120 echoes the Great Assembly of the Second Temple period. Coalitions need 61 to govern."],
  ["Politics","In what year did Benjamin Netanyahu first become Prime Minister?","1996","2009","1992","2001","He beat Shimon Peres in Israel's first direct election for PM, held months after Rabin's assassination."],
  ["Politics","The word 'intifada' translates from Arabic roughly as what?","Shaking off","Return","Struggle","Steadfastness","It describes the act of shaking something off, such as occupation."],
];

/* ---------- Config ---------- */
const PER_DAY = 5;
const LIMIT = 20000;            // ms per question
const MAX_PTS = 1000, MIN_PTS = 100;
const EPOCH = new Date(2026, 10, 14); // Gazle #1, 14 Nov 2026 (local)

/* ---------- Storage (safe) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("gazle:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gazle:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => n.toLocaleString("en-US");
function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dateKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayIndex(d) { const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return Math.round((a - EPOCH) / 86400000); }

function buildQuestion(idx, r) {
  const [era, q, correct, w1, w2, w3, fact] = BANK[idx];
  const options = shuffle([correct, w1, w2, w3], r);
  return { idx, era, q, options, answer: options.indexOf(correct), fact };
}
function dailyQuestions(n) {
  const perCycle = Math.floor(BANK.length / PER_DAY);
  const cycle = Math.floor(n / perCycle), pos = ((n % perCycle) + perCycle) % perCycle * PER_DAY;
  const perm = shuffle(BANK.map((_, i) => i), rng(9001 + cycle * 7919));
  const r = rng(424242 + n * 31);
  return perm.slice(pos, pos + PER_DAY).map((i) => buildQuestion(i, r));
}
function practiceQuestions() {
  const r = Math.random;
  return shuffle(BANK.map((_, i) => i), r).slice(0, PER_DAY).map((i) => buildQuestion(i, r));
}
function points(ms) { return Math.round(MIN_PTS + (MAX_PTS - MIN_PTS) * Math.max(0, 1 - ms / LIMIT)); }
function grade(a) { if (!a.correct) return "r"; return a.pts >= 700 ? "g" : "y"; }

/* ---------- State ---------- */
let today = new Date(), tKey = dateKey(today), tNum = dayIndex(today) + 1;
let game = null;          // { mode, qs, answers[], i }
let timer = null;         // { start, raf }

function dailyRecord() { return store.get("daily:" + tKey, null); }
function saveDaily(rec) { store.set("daily:" + tKey, rec); }

function refreshChips() {
  const s = store.get("stats", { best: 0, pbest: 0, streak: 0, lastDay: null, played: 0, totalCorrect: 0 });
  // streak breaks if yesterday wasn't played
  const y = new Date(today); y.setDate(y.getDate() - 1);
  const streak = (s.lastDay === tKey || s.lastDay === dateKey(y)) ? s.streak : 0;
  $("#c-streak").textContent = streak;
  $("#c-best").textContent = fmt(s.best);
  $("#c-pbest").textContent = fmt(s.pbest);
  $("#daynum").textContent = "#" + tNum + " · " + today.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  return Object.assign({}, s, { streak });
}

/* ---------- Screens ---------- */
function showStart() {
  stopTimer();
  const rec = dailyRecord();
  if (rec && rec.done) return showResults("daily");
  const resuming = rec && rec.answers && rec.answers.length;
  $("#stage").innerHTML = `
    <div class="label">Daily · ${PER_DAY} questions</div>
    <h2>Five questions on the history of Israel and Palestine. The faster you answer, the more you score.</h2>
    <dl class="rules">
      <dt>${fmt(MAX_PTS)}</dt><dd>points for an instant correct answer</dd>
      <dt>${MIN_PTS}</dt><dd>points for a correct answer in the final second</dd>
      <dt>0</dt><dd>for a wrong answer or running out the ${LIMIT / 1000}-second clock</dd>
      <dt>∞</dt><dd>practice rounds unlock once today's daily is done</dd>
    </dl>
    <div class="row">
      <button class="btn btn-primary" id="go">${resuming ? "Resume daily (" + rec.answers.length + "/" + PER_DAY + ")" : "Start daily #" + tNum}</button>
    </div>`;
  $("#go").onclick = () => startGame("daily");
  $("#go").focus();
}

function startGame(mode) {
  const qs = mode === "daily" ? dailyQuestions(tNum - 1) : practiceQuestions();
  let answers = [];
  if (mode === "daily") {
    const rec = dailyRecord();
    answers = rec && rec.answers ? rec.answers : [];
    saveDaily({ answers, done: false });
  }
  game = { mode, qs, answers, i: answers.length, locked: false };
  if (game.i >= PER_DAY) return finish();
  showQuestion();
}

function pipsHTML() {
  return '<div class="progress">' + game.qs.map((_, k) => {
    const a = game.answers[k];
    return '<span class="pip ' + (a ? grade(a) : (k === game.i ? "cur" : "")) + '"></span>';
  }).join("") + "</div>";
}

function showQuestion() {
  const q = game.qs[game.i];
  game.locked = false;
  $("#stage").innerHTML = `
    ${pipsHTML()}
    <div class="qhead">
      <span class="era">${game.mode === "practice" ? "Practice · " : ""}Q${game.i + 1} · ${esc(q.era)}</span>
      <span class="livepts" id="live">${fmt(MAX_PTS)}</span>
    </div>
    <div class="timer"><i id="bar"></i></div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}" id="opt${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach((b) => (b.onclick = () => answer(+b.dataset.k)));
  startTimer();
}

function startTimer() {
  stopTimer();
  const start = performance.now();
  timer = { start, raf: 0 };
  const bar = $("#bar"), live = $("#live");
  const tick = (now) => {
    const ms = now - start;
    const frac = Math.max(0, 1 - ms / LIMIT);
    bar.style.transform = "scaleX(" + frac + ")";
    live.textContent = fmt(points(ms));
    if (ms >= LIMIT) { answer(-1); return; }
    timer.raf = requestAnimationFrame(tick);
  };
  timer.raf = requestAnimationFrame(tick);
}
function stopTimer() { if (timer) cancelAnimationFrame(timer.raf); timer = null; }

function answer(k) {
  if (!game || game.locked || !timer) return;
  game.locked = true;
  const ms = Math.min(LIMIT, performance.now() - timer.start);
  stopTimer();
  const q = game.qs[game.i];
  const correct = k === q.answer;
  const pts = correct ? points(ms) : 0;
  const a = { idx: q.idx, choice: k, correct, ms: Math.round(ms), pts };
  game.answers.push(a);
  if (game.mode === "daily") saveDaily({ answers: game.answers, done: false });

  document.querySelectorAll(".opt").forEach((b) => {
    const bk = +b.dataset.k;
    b.disabled = true;
    if (bk === q.answer) b.classList.add("correct");
    else if (bk === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("#live").textContent = correct ? "+" + fmt(pts) : "+0";
  $(".progress").outerHTML = pipsHTML();
  const last = game.i === PER_DAY - 1;
  const verdict = k === -1 ? "Out of time" : correct ? "Correct · " + (ms / 1000).toFixed(1) + "s" : "Not quite";
  $("#fb").innerHTML = `
    <div class="feedback">
      <div class="verdict ${correct ? "good" : "bad"}">${verdict}</div>
      <p class="muted">${esc(q.fact)}</p>
      <div class="row"><button class="btn btn-primary" id="next">${last ? "See results" : "Next question"}</button></div>
    </div>`;
  $("#next").onclick = next;
  $("#next").focus();
}

function next() {
  if (!game) return;
  game.i++;
  if (game.i >= PER_DAY) finish(); else showQuestion();
}

function finish() {
  const total = game.answers.reduce((s, a) => s + a.pts, 0);
  const s = refreshChips();
  if (game.mode === "daily") {
    const rec = dailyRecord();
    if (!rec || !rec.done) {
      saveDaily({ answers: game.answers, done: true, total });
      const y = new Date(today); y.setDate(y.getDate() - 1);
      const streak = s.lastDay === dateKey(y) ? s.streak + 1 : (s.lastDay === tKey ? s.streak : 1);
      store.set("stats", Object.assign({}, s, {
        best: Math.max(s.best, total), streak, lastDay: tKey, played: (s.played || 0) + 1,
        totalCorrect: (s.totalCorrect || 0) + game.answers.filter((a) => a.correct).length
      }));
    }
  } else {
    const newBest = total > s.pbest;
    store.set("stats", Object.assign({}, s, { pbest: Math.max(s.pbest, total) }));
    game.newBest = newBest;
  }
  showResults(game.mode, game);
}

function breakdownHTML(answers) {
  return '<div class="breakdown">' + answers.map((a) => {
    const g = grade(a), col = g === "g" ? "var(--good)" : g === "y" ? "var(--gold)" : "var(--bad)";
    return `<div class="bd"><span class="dot" style="background:${col}"></span><span class="q">${esc(BANK[a.idx][1])}</span><span class="t">${a.choice === -1 ? "—" : (a.ms / 1000).toFixed(1) + "s"}</span><span class="p">${fmt(a.pts)}</span></div>`;
  }).join("") + "</div>";
}

function shareText(rec) {
  const map = { g: "🟩", y: "🟨", r: "🟥" };
  const avg = rec.answers.filter((a) => a.correct);
  const avgS = avg.length ? (avg.reduce((s, a) => s + a.ms, 0) / avg.length / 1000).toFixed(1) + "s avg" : "";
  return "Gazle #" + tNum + "  " + fmt(rec.total) + "/" + fmt(MAX_PTS * PER_DAY) + "\n" + rec.answers.map((a) => map[grade(a)]).join("") + (avgS ? "  " + avgS : "");
}

function showResults(mode, g) {
  stopTimer();
  const s = refreshChips();
  const isDaily = mode === "daily";
  const rec = isDaily ? dailyRecord() : { answers: g.answers, total: g.answers.reduce((x, a) => x + a.pts, 0) };
  const correct = rec.answers.filter((a) => a.correct).length;
  $("#stage").innerHTML = `
    ${isDaily ? '<div class="label">Daily #' + tNum + ' complete</div>' : '<div class="label">Practice round' + (g.newBest ? " · new practice best" : "") + "</div>"}
    <div class="big">${fmt(rec.total)} <small>/ ${fmt(MAX_PTS * PER_DAY)} · ${correct}/${PER_DAY} correct</small></div>
    ${breakdownHTML(rec.answers)}
    ${isDaily ? `
      <div class="stats">
        <div class="stat"><span class="label">Played</span><b>${s.played || 1}</b></div>
        <div class="stat"><span class="label">Streak</span><b>${s.streak}</b></div>
        <div class="stat"><span class="label">Best</span><b>${fmt(s.best)}</b></div>
        <div class="stat"><span class="label">Accuracy</span><b>${s.played ? Math.round((s.totalCorrect / (s.played * PER_DAY)) * 100) : 0}%</b></div>
      </div>
      <div class="stat"><span class="label">Next daily in</span><span class="countdown" id="cd">--:--:--</span></div>` : ""}
    <div class="row">
      ${isDaily ? '<button class="btn btn-ghost" id="share">Copy result</button>' : '<button class="btn btn-ghost" id="back">Back to daily results</button>'}
      <button class="btn btn-primary" id="practice">${isDaily ? "Play practice round" : "Play again"}</button>
    </div>
    <div class="toast" id="toast"></div>`;
  $("#practice").onclick = () => startGame("practice");
  $("#practice").focus();
  if (isDaily) {
    $("#share").onclick = () => {
      const text = shareText(rec);
      const done = () => ($("#toast").textContent = "Copied to clipboard.");
      const fail = () => {
        $("#toast").innerHTML = '<textarea class="share-fallback" id="sharebox" rows="3" readonly>' + esc(text) + "</textarea>";
        const t = $("#sharebox"); t.focus(); t.select();
      };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
    };
    tickCountdown();
  } else {
    $("#back").onclick = () => { game = null; showResults("daily"); };
  }
}

let cdTimer = 0;
function tickCountdown() {
  clearInterval(cdTimer);
  const run = () => {
    const now = new Date();
    if (dateKey(now) !== tKey) { // new day rolled over
      clearInterval(cdTimer);
      today = now; tKey = dateKey(now); tNum = dayIndex(now) + 1;
      refreshChips(); showStart(); return;
    }
    const el = $("#cd"); if (!el) { clearInterval(cdTimer); return; }
    const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const left = Math.max(0, Math.floor((mid - now) / 1000));
    const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), sec = left % 60;
    el.textContent = [h, m, sec].map((v) => String(v).padStart(2, "0")).join(":");
  };
  run(); cdTimer = setInterval(run, 1000);
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (game && !game.locked && timer && /^[1-4]$/.test(e.key)) { e.preventDefault(); answer(+e.key - 1); }
  else if (e.key === "Enter" && game && game.locked && $("#next")) { e.preventDefault(); next(); }
});

/* If the tab is hidden mid-question during the daily, the clock keeps running (no pausing to look things up). */

refreshChips();
showStart();
})();
</script>
